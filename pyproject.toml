[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dnsloadforge"
dynamic = ["version"]
description = "Simulate a 10,000-person office's DNS traffic and judge a DNS filtering appliance or cloud resolver."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zach Snow" }]
keywords = ["dns", "dns-filtering", "load-testing", "security", "msp", "network"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: System :: Networking",
]
# No runtime dependencies, on purpose: it has to run on a bare Windows box.
dependencies = []

[project.scripts]
dnsloadforge = "dnsloadforge.cli:main"

[tool.setuptools.dynamic]
version = { attr = "dnsloadforge.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dnsloadforge = ["dashboard/*.html", "sources.json"]
