name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install (no runtime dependencies)
        run: python -m pip install -e .
      - name: Test
        # The suite drives real UDP against a local mock appliance and needs no network.
        run: python -m unittest discover -s tests -t tests -v

  # Single stable check name for branch protection; fails unless every matrix leg passed.
  ci:
    name: ci
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All matrix legs passed
        run: test "${{ needs.test.result }}" = "success"
